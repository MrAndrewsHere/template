# https://taskfile.dev
version: '3'
dotenv: [ '.env' ]

vars:
  ENV: '{{.ENV | default "dev"}}'

env:
  CONTAINER: '{{.APP_NAMESPACE}}-app'
  DOCKER_TTY: '-it'

tasks:
  # === Internal helpers ===
  compose:
    internal: true
    vars:
      FILES: '{{.FILES | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - docker compose {{.FILES}} {{.ARGS}}

  artisan:
    internal: true
    vars:
      ARGS: '{{.ARGS}}'
    cmds:
      - docker exec $DOCKER_TTY $CONTAINER php artisan {{.ARGS}}

  vendor-bin:
    internal: true
    vars:
      BIN: '{{.BIN}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - docker exec $DOCKER_TTY $CONTAINER {{.BIN}} {{.ARGS}}

  compose-files:
    internal: true
    vars:
      ACTION: '{{.ACTION}}'
    cmds:
      - task: compose
        vars:
          FILES: '{{if eq .ENV "prod"}}-f docker-compose.yml -f docker-compose.prod.yml{{end}}'
          ARGS: '{{.ACTION}}'

  # === Compose / Orchestration ===
  build:
    desc: Build and start containers (use ENV=prod for production)
    cmds:
      - task: compose-files
        vars: { ACTION: 'up -d --build' }

  up:
    desc: Start containers
    cmds:
      - task: compose-files
        vars: { ACTION: 'up -d --remove-orphans' }

  restart:
    desc: Restart all containers
    cmds:
      - task: compose
        vars: { ARGS: 'restart' }

  stop:
    desc: Stop all containers
    cmds:
      - task: compose
        vars: { ARGS: 'stop' }

  down:
    desc: Stop and remove containers and volumes
    cmds:
      - task: compose
        vars: { ARGS: 'down -v' }

  logs:
    desc: Tail container logs
    cmds:
      - task: compose
        vars: { ARGS: 'logs -f --tail=100' }

  ps:
    desc: Show running containers
    cmds:
      - task: compose
        vars: { ARGS: 'ps' }

  # === App / Container ===
  shell:
    desc: Open bash inside the app container
    cmds:
      - docker exec $DOCKER_TTY $CONTAINER /bin/bash

  composer-install:
    desc: Install PHP dependencies
    cmds:
      - docker exec $DOCKER_TTY $CONTAINER composer install --no-interaction --prefer-dist --no-progress

  npm-install:
    desc: Install Node dependencies
    cmds:
      - docker exec $DOCKER_TTY $CONTAINER npm ci

  key-generate:
    desc: Generate APP_KEY
    cmds:
      - task: artisan
        vars: { ARGS: 'key:generate' }

  storage-link:
    desc: Create storage symlink
    cmds:
      - task: artisan
        vars: { ARGS: 'storage:link' }

  cache-clear:
    desc: Clear application caches
    cmds:
      - task: artisan
        vars: { ARGS: 'cache:clear' }

  optimize:
    desc: Cache config/routes/views (prod)
    cmds:
      - task: artisan
        vars: { ARGS: 'optimize' }

  optimize-clear:
    desc: Clear cached config/routes/views
    cmds:
      - task: artisan
        vars: { ARGS: 'optimize:clear' }

  # === Database ===
  migrate:
    desc: Run database migrations
    cmds:
      - task: artisan
        vars: { ARGS: 'migrate' }

  migrate-fresh:
    desc: Drop all tables and re-run migrations
    cmds:
      - task: artisan
        vars: { ARGS: 'migrate:fresh' }

  seed:
    desc: Run database seeders
    cmds:
      - task: artisan
        vars: { ARGS: 'db:seed' }

  db-setup:
    desc: Migrate + seed
    cmds:
      - task: migrate
      - task: seed

  db-fresh:
    desc: Fresh migrate + seed
    cmds:
      - task: migrate-fresh
      - task: seed

  # === Quality / CI ===
  pint:
    desc: Fix code style (Pint)
    cmds:
      - task: vendor-bin
        vars:
          BIN: 'vendor/bin/pint'
          ARGS: '--config ./pint.json'

  pint-check:
    desc: Check code style without fixing
    cmds:
      - task: vendor-bin
        vars:
          BIN: 'vendor/bin/pint'
          ARGS: '--test --config ./pint.json'

  rector:
    desc: Run Rector refactoring
    cmds:
      - task: vendor-bin
        vars:
          BIN: 'vendor/bin/rector'
          ARGS: 'process'

  rector-dry:
    desc: Rector dry-run
    cmds:
      - task: vendor-bin
        vars:
          BIN: 'vendor/bin/rector'
          ARGS: 'process --dry-run'

  insights:
    desc: Run PHP Insights
    cmds:
      - task: vendor-bin
        vars:
          BIN: 'vendor/bin/phpinsights'
          ARGS: '--summary'

  stan:
    desc: Run PHPStan static analysis
    cmds:
      - task: vendor-bin
        vars:
          BIN: 'vendor/bin/phpstan'
          ARGS: 'analyse -c ./phpstan.neon'

  test:
    desc: Run tests in parallel
    cmds:
      - task: artisan
        vars: { ARGS: 'test --env=testing --parallel' }

  check:
    desc: Run all quality checks (no mutations)
    cmds:
      - task: pint-check
      - task: rector-dry
      - task: stan
      - task: test
      - task: insights

  # === Utilities ===
  tinker:
    desc: Open Laravel Tinker
    cmds:
      - docker exec -it $CONTAINER php artisan tinker

  swagger:
    desc: Generate Swagger/OpenAPI docs
    cmds:
      - task: artisan
        vars: { ARGS: 'l5-swagger:generate' }

  horizon:
    desc: Horizon status
    cmds:
      - task: artisan
        vars: { ARGS: 'horizon:status' }

  # === Composite scenarios ===
  init:
    desc: Full project init (dev)
    cmds:
      - task: build
      - task: composer-install
      - task: npm-install
      - task: key-generate
      - task: storage-link
      - task: db-setup
      - echo "--- Init complete. Run 'task up' to start. ---"

  deploy:
    desc: Deploy-like sequence for prod
    cmds:
      - task: build
        vars: { ENV: 'prod' }
      - task: migrate
      - task: optimize
